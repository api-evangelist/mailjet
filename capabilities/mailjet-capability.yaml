naftiko: 1.0.0-alpha2
info:
  label: Mailjet Email API
  description: The Mailjet Email API enables sending transactional and marketing emails programmatically via JSON requests.
    The API also exposes resources for managing contacts, contact lists, segments, campaigns, templates, sender addresses,
    statistics, and event tracking. All requests use HTTP Basic authentication with an API key and secret pair issued from
    the Mailjet account dashboard.
  tags:
  - Mailjet
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: mailjet
    baseUri: https://api.mailjet.com/v3.1
    description: Mailjet Email API HTTP API.
    authentication:
      type: basic
      username: '{{MAILJET_USERNAME}}'
      password: '{{MAILJET_PASSWORD}}'
    resources:
    - name: send
      path: /send
      operations:
      - name: sendemail
        method: POST
        description: Send transactional emails (v3.1)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contact
      path: /contact
      operations:
      - name: listcontacts
        method: GET
        description: List contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcontact
        method: POST
        description: Create a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contact-id
      path: /contact/{id}
      operations:
      - name: getcontact
        method: GET
        description: Get a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatecontact
        method: PUT
        description: Update a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contactslist
      path: /contactslist
      operations:
      - name: listcontactslists
        method: GET
        description: List contact lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcontactslist
        method: POST
        description: Create a contact list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contactslist-id
      path: /contactslist/{id}
      operations:
      - name: getcontactslist
        method: GET
        description: Get a contact list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletecontactslist
        method: DELETE
        description: Delete a contact list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contactslist-id-managemanycontacts
      path: /contactslist/{id}/managemanycontacts
      operations:
      - name: managemanycontacts
        method: POST
        description: Bulk add or remove contacts in a list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: campaign
      path: /campaign
      operations:
      - name: listcampaigns
        method: GET
        description: List campaigns
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: campaigndraft
      path: /campaigndraft
      operations:
      - name: listcampaigndrafts
        method: GET
        description: List campaign drafts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcampaigndraft
        method: POST
        description: Create a campaign draft
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: campaigndraft-id-send
      path: /campaigndraft/{id}/send
      operations:
      - name: sendcampaigndraft
        method: POST
        description: Send a campaign draft
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: template
      path: /template
      operations:
      - name: listtemplates
        method: GET
        description: List templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtemplate
        method: POST
        description: Create a template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sender
      path: /sender
      operations:
      - name: listsenders
        method: GET
        description: List sender addresses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsender
        method: POST
        description: Create a sender address
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: statcounters
      path: /statcounters
      operations:
      - name: getstatcounters
        method: GET
        description: Get sending statistic counters
        inputParameters:
        - name: SourceID
          in: query
          type: integer
        - name: CounterSource
          in: query
          type: string
        - name: CounterTiming
          in: query
          type: string
        - name: CounterResolution
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: messagehistory-id
      path: /messagehistory/{id}
      operations:
      - name: getmessagehistory
        method: GET
        description: Get the event history of a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
