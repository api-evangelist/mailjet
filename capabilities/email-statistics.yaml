naftiko: 1.0.0-alpha2
info:
  label: Mailjet Email API — Statistics
  description: 'Mailjet Email API — Statistics. 1 operations. Lead operation: Get sending statistic counters. Self-contained
    Naftiko capability covering one Mailjet business surface.'
  tags:
  - Mailjet
  - Statistics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MAILJET_API_KEY: MAILJET_API_KEY
capability:
  consumes:
  - type: http
    namespace: email-statistics
    baseUri: https://api.mailjet.com/v3.1
    description: Mailjet Email API — Statistics business capability. Self-contained, no shared references.
    resources:
    - name: statcounters
      path: /statcounters
      operations:
      - name: getstatcounters
        method: GET
        description: Get sending statistic counters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SourceID
          in: query
          type: integer
        - name: CounterSource
          in: query
          type: string
        - name: CounterTiming
          in: query
          type: string
        - name: CounterResolution
          in: query
          type: string
    authentication:
      type: basic
      username: '{{env.MAILJET_USER}}'
      password: '{{env.MAILJET_PASS}}'
  exposes:
  - type: rest
    namespace: email-statistics-rest
    port: 8080
    description: REST adapter for Mailjet Email API — Statistics. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/statcounters
      name: statcounters
      description: REST surface for statcounters.
      operations:
      - method: GET
        name: getstatcounters
        description: Get sending statistic counters
        call: email-statistics.getstatcounters
        with:
          SourceID: rest.SourceID
          CounterSource: rest.CounterSource
          CounterTiming: rest.CounterTiming
          CounterResolution: rest.CounterResolution
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: email-statistics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Mailjet Email API — Statistics. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-sending-statistic-counters
      description: Get sending statistic counters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: email-statistics.getstatcounters
      with:
        SourceID: tools.SourceID
        CounterSource: tools.CounterSource
        CounterTiming: tools.CounterTiming
        CounterResolution: tools.CounterResolution
      outputParameters:
      - type: object
        mapping: $.
