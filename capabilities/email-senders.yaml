naftiko: 1.0.0-alpha2
info:
  label: Mailjet Email API — Senders
  description: 'Mailjet Email API — Senders. 2 operations. Lead operation: List sender addresses. Self-contained Naftiko capability
    covering one Mailjet business surface.'
  tags:
  - Mailjet
  - Senders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MAILJET_API_KEY: MAILJET_API_KEY
capability:
  consumes:
  - type: http
    namespace: email-senders
    baseUri: https://api.mailjet.com/v3.1
    description: Mailjet Email API — Senders business capability. Self-contained, no shared references.
    resources:
    - name: sender
      path: /sender
      operations:
      - name: listsenders
        method: GET
        description: List sender addresses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsender
        method: POST
        description: Create a sender address
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.MAILJET_USER}}'
      password: '{{env.MAILJET_PASS}}'
  exposes:
  - type: rest
    namespace: email-senders-rest
    port: 8080
    description: REST adapter for Mailjet Email API — Senders. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/sender
      name: sender
      description: REST surface for sender.
      operations:
      - method: GET
        name: listsenders
        description: List sender addresses
        call: email-senders.listsenders
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsender
        description: Create a sender address
        call: email-senders.createsender
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: email-senders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Mailjet Email API — Senders. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-sender-addresses
      description: List sender addresses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: email-senders.listsenders
      outputParameters:
      - type: object
        mapping: $.
    - name: create-sender-address
      description: Create a sender address
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: email-senders.createsender
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
