naftiko: 1.0.0-alpha2
info:
  label: Mailjet Email API — Contacts
  description: 'Mailjet Email API — Contacts. 4 operations. Lead operation: List contacts. Self-contained Naftiko capability
    covering one Mailjet business surface.'
  tags:
  - Mailjet
  - Contacts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MAILJET_API_KEY: MAILJET_API_KEY
capability:
  consumes:
  - type: http
    namespace: email-contacts
    baseUri: https://api.mailjet.com/v3.1
    description: Mailjet Email API — Contacts business capability. Self-contained, no shared references.
    resources:
    - name: contact
      path: /contact
      operations:
      - name: listcontacts
        method: GET
        description: List contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcontact
        method: POST
        description: Create a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: contact-id
      path: /contact/{id}
      operations:
      - name: getcontact
        method: GET
        description: Get a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatecontact
        method: PUT
        description: Update a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.MAILJET_USER}}'
      password: '{{env.MAILJET_PASS}}'
  exposes:
  - type: rest
    namespace: email-contacts-rest
    port: 8080
    description: REST adapter for Mailjet Email API — Contacts. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/contact
      name: contact
      description: REST surface for contact.
      operations:
      - method: GET
        name: listcontacts
        description: List contacts
        call: email-contacts.listcontacts
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcontact
        description: Create a contact
        call: email-contacts.createcontact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contact/{id}
      name: contact-id
      description: REST surface for contact-id.
      operations:
      - method: GET
        name: getcontact
        description: Get a contact
        call: email-contacts.getcontact
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatecontact
        description: Update a contact
        call: email-contacts.updatecontact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: email-contacts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Mailjet Email API — Contacts. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-contacts
      description: List contacts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: email-contacts.listcontacts
      outputParameters:
      - type: object
        mapping: $.
    - name: create-contact
      description: Create a contact
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: email-contacts.createcontact
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-contact
      description: Get a contact
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: email-contacts.getcontact
      outputParameters:
      - type: object
        mapping: $.
    - name: update-contact
      description: Update a contact
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: email-contacts.updatecontact
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
