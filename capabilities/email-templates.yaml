naftiko: 1.0.0-alpha2
info:
  label: Mailjet Email API — Templates
  description: 'Mailjet Email API — Templates. 2 operations. Lead operation: List templates. Self-contained Naftiko capability
    covering one Mailjet business surface.'
  tags:
  - Mailjet
  - Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MAILJET_API_KEY: MAILJET_API_KEY
capability:
  consumes:
  - type: http
    namespace: email-templates
    baseUri: https://api.mailjet.com/v3.1
    description: Mailjet Email API — Templates business capability. Self-contained, no shared references.
    resources:
    - name: template
      path: /template
      operations:
      - name: listtemplates
        method: GET
        description: List templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtemplate
        method: POST
        description: Create a template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.MAILJET_USER}}'
      password: '{{env.MAILJET_PASS}}'
  exposes:
  - type: rest
    namespace: email-templates-rest
    port: 8080
    description: REST adapter for Mailjet Email API — Templates. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/template
      name: template
      description: REST surface for template.
      operations:
      - method: GET
        name: listtemplates
        description: List templates
        call: email-templates.listtemplates
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtemplate
        description: Create a template
        call: email-templates.createtemplate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: email-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Mailjet Email API — Templates. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-templates
      description: List templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: email-templates.listtemplates
      outputParameters:
      - type: object
        mapping: $.
    - name: create-template
      description: Create a template
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: email-templates.createtemplate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
